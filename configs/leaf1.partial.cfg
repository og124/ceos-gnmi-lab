! Partial startup-config for leaf1.
!
! Why ".partial": containerlab ships a default startup-config for arista_ceos
! nodes, and that default is what turns gNMI on, creates the admin user and
! addresses Management0. A plain `startup-config:` REPLACES it outright, so a
! full config silently kills gNMI on 6030 and the lab looks broken for a
! reason nothing in the logs points at. A .partial file is merged onto the
! default instead.
!
! The gNMI and admin stanzas below are redundant on purpose: if the merge works
! they're a harmless no-op (EOS config is idempotent); if a containerlab
! version ever replaces rather than merges, they're the difference between a
! working lab and a mystery.

hostname leaf1
!
username admin privilege 15 role network-admin secret 0 admin
!
management api gnmi
   transport grpc default
   no shutdown
!
interface Ethernet1
   description leaf2:Ethernet1
   no switchport
   ip address 10.10.10.1/30
!
ip routing
!
end
